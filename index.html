<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Tasks</title>
<style>:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1c2321;--muted:#68726e;--line:#e6e2d9;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#d9efeb;
  --warn:#b45309;--warn-soft:#fdf0d8;--bad:#b42318;--bad-soft:#fde4e1;--ok:#15803d;
  --block:#eceae3;--shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1311;--card:#171e1b;--ink:#eef2ef;--muted:#93a09a;--line:#27312d;
    --accent:#2dd4bf;--accent-ink:#04201c;--accent-soft:#12302b;
    --warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1714;--ok:#4ade80;
    --block:#1b2420;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;padding:18px 16px 190px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello{font-size:13px;color:var(--muted);font-weight:500}
.date{font-size:24px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}
.banner .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.tabs{display:flex;background:var(--block);border-radius:14px;padding:4px;margin:6px 0 12px}
.tabs button{flex:1;padding:8px 0;border-radius:11px;font-weight:700;color:var(--muted);font-size:14px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.free{font-size:13px;color:var(--muted);margin:0 2px 10px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.day-h h3{font-size:15px;font-weight:800}
.day-h span{font-size:12px;color:var(--muted)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.item.late{box-shadow:inset 0 0 0 1.5px var(--bad),var(--shadow)}
.chk{flex:none;width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;margin-top:1px}
.chk svg{width:16px;height:16px;opacity:0}
.item.done .chk{background:var(--ok);box-shadow:none;color:#fff}
.item.done .chk svg{opacity:1}
.body{flex:1;min-width:0}
.t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--block);color:var(--muted)}
.pill.hi{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.sync{background:var(--accent-soft);color:var(--accent)}
.fixed{display:flex;gap:10px;align-items:center;padding:6px 12px;margin-bottom:6px;color:var(--muted);font-size:13px;border-left:3px solid var(--line);margin-left:6px}
.fixed b{font-weight:600}
.nowline{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--accent);font-size:12px;font-weight:800}
.nowline:after{content:"";flex:1;height:2px;background:var(--accent);border-radius:2px;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:34px 20px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.dock-in{max-width:560px;margin:0 auto}
.say{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);font-size:14.5px}
.say .you{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.say .bot{white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;height:50px;border-radius:25px;border:0;padding:0 18px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);font-size:16px;outline:none}
.bar input:focus{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.mic{flex:none;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,118,110,.35)}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}100%{box-shadow:0 0 0 18px rgba(180,35,24,0)}}
.send{flex:none;width:44px;height:50px;color:var(--accent);display:grid;place-items:center}
.send svg{width:24px;height:24px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;height:46px;border-radius:12px;border:0;padding:0 12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--block);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.rowbtn{display:flex;gap:8px;margin-top:14px}
.rowbtn .btn{flex:1}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.set small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]:after{left:21px}
.tip{font-size:13px;color:var(--muted);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.listen{display:flex;align-items:center;gap:12px;background:var(--bad-soft);color:var(--ink);border-radius:18px;padding:12px 14px;margin-bottom:10px;font-weight:700;font-size:14.5px}
.listen[hidden]{display:none}
.wave{display:flex;gap:3px;align-items:center;height:22px;flex:none}
.wave i{display:block;width:4px;height:8px;border-radius:2px;background:var(--bad);animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
@media (prefers-reduced-motion:reduce){.wave i,.mic.on{animation:none}}
</style>
</head>

<div id="app"></div>
<script>window.__OFFLINE__=true;</script>
<script>
/*CORE_START*/
const DAY = 1440, TZ_OFF = 60, MIN48 = 2880;
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* Time model: "L-minutes" = minutes since epoch, expressed in Lagos local time (UTC+1, no DST). */
function nowL() { return Math.floor(Date.now() / 60000) + TZ_OFF; }
function dayStart(t) { return Math.floor(t / DAY) * DAY; }
function parts(t) {
  const d = new Date(t * 60000);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() };
}
function mk(y, mo, d, h, mi) { return Date.UTC(y, mo - 1, d, h || 0, mi || 0) / 60000; }
function isoL(t) { const p = parts(t); return p.y + '-' + pad(p.mo) + '-' + pad(p.d) + 'T' + pad(p.h) + ':' + pad(p.mi) + ':00'; }
function keyOf(t) { const p = parts(t); return p.y + '-' + pad(p.mo) + '-' + pad(p.d); }
function fromKey(k) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k || ''); return m ? mk(+m[1], +m[2], +m[3]) : null; }
function hhmm(t) { const p = parts(t); return pad(p.h) + ':' + pad(p.mi); }
function fmtTime(t) { const p = parts(t); return (p.h % 12 || 12) + ':' + pad(p.mi) + (p.h < 12 ? ' AM' : ' PM'); }
function fmtDay(t) { const p = parts(t); return DOW[p.dow] + ' ' + p.d + ' ' + MON[p.mo - 1]; }
function fmtDayLong(t) { const p = parts(t); return DOWFULL[p.dow] + ', ' + p.d + ' ' + MON[p.mo - 1]; }
function fmtDur(m) {
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm' : h + (h === 1 ? ' hour' : ' hours');
}
function relDay(t, now) {
  const d = (dayStart(t) - dayStart(now)) / DAY;
  if (d === 0) return 'today'; if (d === 1) return 'tomorrow'; if (d === -1) return 'yesterday';
  return fmtDay(t);
}

/* Your fixed routine (Nigerian time). D = start of a day. */
function fixedBlocks(D) {
  const w = parts(D).dow, B = [];
  const add = (h1, m1, h2, m2, kind, label) => B.push({ s: D + h1 * 60 + m1, e: D + h2 * 60 + m2, kind, label, fixed: true });
  add(0, 30, 6, 30, 'sleep', 'Sleep');
  add(12, 0, 13, 0, 'lunch', 'Lunch');
  if (w >= 1 && w <= 5) add(15, 0, 23, 30, 'work', 'Work');
  if (w >= 2 && w <= 6) add(9, 0, 11, 0, 'fatima', "Ms. Fatima's work");
  if (w === 0) add(8, 0, 14, 0, 'church', 'Church');
  return B;
}

const WIN = { morning: [8, 12], afternoon: [12, 17], evening: [17, 22], night: [19, 22] };
function rangesFor(type, win) {
  if (win && WIN[win]) return [WIN[win]];
  return type === 'out' ? [[8, 18]] : [[8, 18], [18, 22]]; /* day fills first, evening after */
}

function busyFor(D, tasks, ext, excludeId) {
  const lo = D, hi = D + DAY, out = fixedBlocks(D);
  for (const t of tasks) {
    if (t.done || t.id === excludeId) continue;
    if (t.start < hi && t.start + t.dur > lo) out.push({ s: t.start, e: t.start + t.dur, kind: 'task', label: t.title, id: t.id });
  }
  for (const x of ext || []) if (x.s < hi && x.e > lo) out.push({ s: x.s, e: x.e, kind: 'ext', label: x.label || 'Calendar event' });
  return out;
}
function isFree(s, e, busy, type) {
  for (const b of busy) {
    const p = b.kind === 'work' ? (type === 'out' ? 30 : 0) : b.kind === 'church' ? 30 : (b.fixed ? 0 : 10);
    if (s < b.e + p && e > b.s - p) return false;
  }
  return true;
}
function slotOnDay(D, dur, type, win, tasks, ext, now, excludeId) {
  const busy = busyFor(D, tasks, ext, excludeId);
  const earliest = D === dayStart(now) ? now + 15 : D;
  for (const [a, b] of rangesFor(type, win)) {
    let s = Math.ceil(Math.max(D + a * 60, earliest) / 15) * 15;
    for (; s + dur <= D + b * 60; s += 15) if (isFree(s, s + dur, busy, type)) return s;
  }
  return null;
}
function freeMinutes(D, tasks, ext, now) {
  const busy = busyFor(D, tasks, ext, null);
  const from = Math.max(D + 8 * 60, D === dayStart(now) ? Math.ceil(now / 15) * 15 : D);
  let n = 0;
  for (let s = from; s < D + 22 * 60; s += 15) if (isFree(s, s + 15, busy, 'desk')) n += 15;
  return n;
}

/* Make room: move a less important, auto-placed task that is at least 48h away. */
function makeRoom(task, D, tasks, ext, now) {
  const cands = tasks.filter(c => c.auto && !c.done && c.id !== task.id && dayStart(c.start) === D && c.start - now >= MIN48 && c.imp < task.imp)
    .sort((a, b) => a.imp - b.imp || b.start - a.start);
  for (const c of cands) {
    const rest = tasks.filter(x => x.id !== c.id);
    const s = slotOnDay(D, task.dur, task.type, task.win, rest, ext, now, null);
    if (s === null) continue;
    const withNew = rest.concat([Object.assign({}, task, { start: s })]);
    for (let k = 0; k < 30; k++) {
      const s2 = slotOnDay(D + k * DAY, c.dur, c.type, c.win, withNew, ext, now, null);
      if (s2 !== null) return { start: s, moved: { task: c, newStart: s2 } };
    }
  }
  return null;
}

/* Pick a time automatically. Dreq = a specific day (start of day) or null for "earliest". */
function scheduleAuto(task, Dreq, tasks, ext, now) {
  const today = dayStart(now);
  if (Dreq !== null) {
    if (Dreq < today) Dreq = today;
    const s = slotOnDay(Dreq, task.dur, task.type, task.win, tasks, ext, now, task.id);
    if (s !== null) return { start: s };
    const r = makeRoom(task, Dreq, tasks, ext, now);
    if (r) return r;
    for (let k = 1; k <= 30; k++) {
      const s2 = slotOnDay(Dreq + k * DAY, task.dur, task.type, task.win, tasks, ext, now, task.id);
      if (s2 !== null) return { start: s2, spilled: true, wanted: Dreq };
    }
    return null;
  }
  for (let k = 0; k < 60; k++) {
    const s = slotOnDay(today + k * DAY, task.dur, task.type, task.win, tasks, ext, now, task.id);
    if (s !== null) return { start: s };
  }
  return null;
}

function conflictsFor(s, e, tasks, ext, excludeId) {
  const out = [], seen = {};
  for (let D = dayStart(s); D <= dayStart(e - 1); D += DAY) {
    for (const b of busyFor(D, tasks, ext, excludeId)) {
      if (s < b.e && e > b.s) { const k = b.kind + b.label; if (!seen[k]) { seen[k] = 1; out.push({ kind: b.kind, label: b.label, s: b.s, e: b.e }); } }
    }
  }
  return out;
}

/* Closest free time to the one asked for (same day first, then later days at the same hour). */
function nearestFree(req, dur, type, tasks, ext, now, excludeId) {
  for (let k = 0; k <= 30; k++) {
    const D = dayStart(req) + k * DAY, target = req + k * DAY, busy = busyFor(D, tasks, ext, excludeId);
    let best = null, bd = 1e9;
    for (let s = D + 7 * 60; s + dur <= D + 22 * 60; s += 15) {
      if (s < now + 10) continue;
      if (!isFree(s, s + dur, busy, type)) continue;
      const d = Math.abs(s - target);
      if (d < bd) { bd = d; best = s; }
    }
    if (best !== null) return best;
  }
  return null;
}

/* ---------- Understanding what you type or say (offline fallback; Claude does the main parsing) ---------- */
const NUMW = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8 };
const WDI = { sunday: 0, sun: 0, monday: 1, mon: 1, tuesday: 2, tues: 2, tue: 2, wednesday: 3, wed: 3, thursday: 4, thurs: 4, thur: 4, thu: 4, friday: 5, fri: 5, saturday: 6, sat: 6 };
const MONI = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function cut(s, re) { const m = s.match(re); return m ? [s.replace(m[0], ' '), m] : [s, null]; }

function parseWhen(text, now) {
  let s = ' ' + String(text || '') + ' ', m;
  const r = { date: null, time: null, endTime: null, dur: null, win: null, any: false };
  const today = dayStart(now), tp = parts(today);
  [s, m] = cut(s, /\b(any ?time|you (?:can )?(?:choose|pick|decide|fix)|whenever|no specific time|your choice|doesn'?t matter|not important|no time|anywhere)\b/i); if (m) r.any = true;
  [s, m] = cut(s, /\b(?:for\s+|about\s+|around\s+)?(\d+(?:\.\d+)?|one|two|three|four|five|six|seven|eight)\s*(?:hours?|hrs?|hr)\b/i);
  if (m) { const n = NUMW[m[1].toLowerCase()] || parseFloat(m[1]); r.dur = Math.round(n * 60); }
  else {
    [s, m] = cut(s, /\b(?:for\s+|about\s+)?(\d+)\s*(?:minutes?|mins?)\b/i);
    if (m) r.dur = +m[1];
    else { [s, m] = cut(s, /\b(?:half an hour|half hour)\b/i); if (m) r.dur = 30; else { [s, m] = cut(s, /\ban hour\b/i); if (m) r.dur = 60; } }
  }
  /* dates */
  [s, m] = cut(s, /\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
  if (m) { let y = tp.y; if (m[3]) { y = +m[3]; if (y < 100) y += 2000; } r.date = mk(y, +m[2], +m[1]); if (!m[3] && r.date < today) r.date = mk(y + 1, +m[2], +m[1]); }
  if (r.date === null) {
    let mm; [s, mm] = cut(s, /\b(\d{1,2})(?:st|nd|rd|th)?\s*(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i);
    if (mm) { r.date = mk(tp.y, MONI[mm[2].toLowerCase()], +mm[1]); if (r.date < today) r.date = mk(tp.y + 1, MONI[mm[2].toLowerCase()], +mm[1]); }
    else {
      [s, mm] = cut(s, /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
      if (mm) { r.date = mk(tp.y, MONI[mm[1].toLowerCase()], +mm[2]); if (r.date < today) r.date = mk(tp.y + 1, MONI[mm[1].toLowerCase()], +mm[2]); }
    }
  }
  if (r.date === null) {
    [s, m] = cut(s, /\bday after tomorrow\b/i); if (m) r.date = today + 2 * DAY;
  }
  if (r.date === null) { [s, m] = cut(s, /\b(tomorrow|tmrw|tomoro|2moro)\b/i); if (m) r.date = today + DAY; }

      h('div', { class: 'field' }, h('label', null, 'How long'), dur),
      h('div', { class: 'field' }, h('label', null, 'Priority'), seg([[1, 'Low'], [2, 'Normal'], [3, 'High']], () => imp, v => imp = v)),
      h('div', { class: 'field' }, h('label', null, 'Where'), seg([['out', '📍 Need to go out'], ['desk', '💻 Anywhere']], () => type, v => type = v)),
      note,
      OFFLINE ? h('a', { class: 'btn', href: gcalLink(t), target: '_blank', rel: 'noopener', style: 'display:block;text-align:center;text-decoration:none' }, '📅 Add to Google Calendar') : null,
      h('div', { class: 'rowbtn' },
        h('button', { class: 'btn danger', onclick: async () => { close(); removeTask(t); unsyncTask(t); render(); say('Deleted “' + t.title + '”.', { chips: [] }); state.undo = Object.assign({}, t); } }, 'Delete'),
        h('button', { class: 'btn primary', onclick: async () => {
          const D = fromKey(date.value), [hh, mm] = (time.value || '09:00').split(':');
          if (D == null) { note.textContent = 'Pick a date.'; return; }
          t.title = title.value.trim() || t.title; t.dur = +dur.value; t.imp = imp; t.type = type; t.start = D + (+hh) * 60 + (+mm); t.auto = false;
          const cf = conflictsFor(t.start, t.start + t.dur, state.tasks, state.ext, t.id);
          saveTask(t); close(); render(); await syncTask(t); render();
          if (cf.length) say('Saved. Heads up: that overlaps with ' + cf.map(c => c.label).join(' and ') + '.');
        } }, 'Save')));
  });
}
function openSettings() {
  loadVoices();
  openSheet((sh, close) => {
    const sw = (key, label, sub) => {
      const b = h('button', { class: 'sw', role: 'switch', 'aria-checked': state.settings[key] ? 'true' : 'false', onclick: () => { state.settings[key] = !state.settings[key]; b.setAttribute('aria-checked', state.settings[key] ? 'true' : 'false'); saveSettings(); render(); } });
      return h('div', { class: 'set' }, h('div', null, h('b', null, label), h('small', null, sub)), b);
    };
    const dot = ok => h('span', { class: 'dot ' + (ok ? 'ok' : 'no') });
    const v = ngVoice();
    sh.append(h('h2', null, 'Settings'),
      sw('speak', 'Speak replies aloud', 'The assistant reads its answers to you.'),
      OFFLINE ? null : sw('email', 'Email reminders', 'Calendar sends reminders to your email before each task.'),
      OFFLINE ? null : sw('calendar', 'Add tasks to Google Calendar', 'Every task becomes an event.'),
      OFFLINE ? h('div', { class: 'set' }, h('div', null, h('b', null, 'Calendar'), h('small', null, 'Download all upcoming tasks as a calendar file with reminders.')), h('button', { class: 'btn small', onclick: exportIcs }, 'Export')) : null,
      h('div', { class: 'tip' },
        h('div', null, dot(true), OFFLINE ? 'Works offline: yes' : null),
        OFFLINE ? null : h('div', null, dot(!!caps.sample), 'Understanding what you say: ' + (caps.sample ? 'Claude (full)' : 'basic mode')),
        h('div', null, dot(!!caps.dict), 'Voice input in this page: ' + (caps.dict ? 'on' : 'use your keyboard\'s mic key')),
        h('div', null, dot(!!v), 'Nigerian English voice: ' + (v ? v.name : 'not found on this device')),
        OFFLINE ? null : h('div', null, dot(state.cal.status === 'ok'), 'Google Calendar: ' + (state.cal.status === 'ok' ? 'connected' : 'not connected yet'))),
      h('div', { class: 'tip' }, 'Accent tip (Android): open Settings → System → Languages → Gboard → add English (Nigeria). For the voice, open Settings → Text-to-speech → Google → Install voice data → English (Nigeria).'),
      h('div', { class: 'tip' }, 'Your routine is built in: sleep 12:30–6:30 AM daily, lunch 12–1 PM, work Mon–Fri 3–11:30 PM, Ms. Fatima Tue–Sat 9–11 AM, church Sunday 8 AM–2 PM. Tasks never go in those times. Ask Claude to change them.'),
      h('div', { class: 'rowbtn' }, h('button', { class: 'btn', onclick: () => speak('Hello. I am ready. Tell me your next task.') }, 'Test voice'), h('button', { class: 'btn primary', onclick: close }, 'Close')));
  });
}

/* ---------- boot ---------- */
function mount() {
  const app = $('#app');
  app.append(h('div', { id: 'view' }));
  const inp = h('input', { id: 'inp', type: 'text', placeholder: 'Tell me a task…', autocomplete: 'off', enterkeyhint: 'send', 'aria-label': 'Task' });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(inp.value); });
  document.body.append(h('div', { class: 'dock' }, h('div', { class: 'dock-in' },
    h('div', { id: 'say', class: 'say', hidden: true, 'aria-live': 'polite' }),
    h('div', { id: 'listen', class: 'listen', hidden: true, 'aria-live': 'polite' }, h('span', { class: 'wave', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i'), h('i')), h('span', { id: 'ltxt' }, 'Listening… speak now')),
    h('div', { class: 'bar' }, inp,
      h('button', { class: 'send', 'aria-label': 'Add task', onclick: () => submit(inp.value) }, icon('send')),
      h('button', { id: 'mic', class: 'mic', 'aria-label': 'Speak a task', onclick: toggleMic }, icon('mic'))))));
  render();
  try { if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } } catch (e) {}
  setInterval(() => { if (!document.hidden && !document.querySelector('.sheet-bg')) render(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
}
async function boot() {
  mount();
  initStore().then(() => render());
  use('sample').then(s => { caps.sample = s; });
  use('tts').then(s => { caps.tts = s; if (s && s.onState) s.onState(({ state: st }) => { ttsBusy = st === 'speaking' || st === 'paused'; }); });
  use('dictation').then(d => { caps.dict = d; wireDictation(); });
  use('mcp').then(async m => {
    caps.mcp = m; render();
    if (m && lsGet('tt_calok') && state.settings.calendar) { try { await loadExt(); await syncAll(); } catch (e) { calErr(e); } render(); }
  });
}
window.__tt = { state, caps, submit, render };
boot();
})();
